<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서해고등학교 3학년 야간자기주도학습 좌석 선착순 신청</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0f1e;
      --surface: #111827;
      --surface2: #1a2235;
      --border: #2a3a55;
      --accent: #3b82f6;
      --accent2: #6366f1;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --seat-avail: #1e3a5f;
      --seat-avail-hover: #2563eb;
      --seat-taken: #1a2e1a;
      --seat-taken-border: #10b981;
      --seat-mine: #2d1b4e;
      --seat-mine-border: #8b5cf6;
      --seat-device: #1a2e1a;
      --seat-device-border: #f59e0b;
      --seat-device-mine: #2e2010;
      --seat-device-mine-border: #fb923c;
      --glow: 0 0 20px rgba(59, 130, 246, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 배경 애니메이션 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(59,130,246,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(99,102,241,0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    /* 헤더 */
    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header .badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    header h1 {
      font-size: clamp(28px, 5vw, 46px);
      font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    header p {
      color: var(--text-muted);
      font-size: 15px;
    }

    /* 상태 배너 */
    #status-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 28px;
      transition: all 0.4s;
    }

    #status-banner.open {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
    }

    #status-banner.closed {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
    }

    #status-banner.waiting {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }

    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse-dot 1.5s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* 메인 레이아웃 */
    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
    }

    /* 카드 */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::before {
      content: '';
      display: block;
      width: 4px; height: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 2px;
    }

    /* 이름/학번 입력 */
    .name-input-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .name-input-row {
      display: flex;
      gap: 10px;
    }

    .name-input-wrap input {
      flex: 1;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .name-input-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }

    .name-input-wrap input::placeholder { color: var(--text-muted); }

    .btn {
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      box-shadow: 0 4px 15px rgba(59,130,246,0.3);
    }

    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,0.4); }
    .btn-primary:active { transform: translateY(0); }

    .btn-danger {
      background: rgba(239,68,68,0.15);
      color: #f87171;
      border: 1px solid rgba(239,68,68,0.3);
    }

    .btn-danger:hover { background: rgba(239,68,68,0.25); }

    .btn-success {
      background: rgba(16,185,129,0.15);
      color: #34d399;
      border: 1px solid rgba(16,185,129,0.3);
    }

    .btn-success:hover { background: rgba(16,185,129,0.25); }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    /* 좌석 그리드 */
    #seat-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    @media (max-width: 500px) {
      #seat-grid { grid-template-columns: repeat(5, 1fr); gap: 8px; }
    }

    .seat {
      aspect-ratio: 1;
      border-radius: 12px;
      border: 1.5px solid rgba(59,130,246,0.3);
      background: var(--seat-avail);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 13px;
      font-weight: 700;
      color: #93c5fd;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    .seat:hover:not(.taken):not(.disabled) {
      background: var(--seat-avail-hover);
      border-color: var(--accent);
      transform: scale(1.05);
      box-shadow: var(--glow);
      color: white;
    }

    .seat.taken {
      background: var(--seat-taken);
      border-color: var(--seat-taken-border);
      color: #6ee7b7;
      cursor: default;
    }

    .seat.mine {
      background: var(--seat-mine);
      border-color: var(--seat-mine-border);
      color: #c4b5fd;
      box-shadow: 0 0 16px rgba(139,92,246,0.3);
      cursor: default;
    }

    .seat.disabled:not(.taken):not(.mine) {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .seat.device {
      background: var(--seat-device);
      border-color: var(--seat-device-border);
      color: #fcd34d;
    }

    .seat.device-mine {
      background: var(--seat-device-mine);
      border-color: var(--seat-device-mine-border);
      color: #fb923c;
      box-shadow: 0 0 16px rgba(251,146,60,0.35);
      cursor: default;
    }

    .seat .seat-device-icon {
      font-size: 8px;
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.85;
      white-space: nowrap;
    }
      font-size: 16px;
      font-weight: 800;
      line-height: 1;
    }

    .seat .seat-name {
      font-size: 9px;
      font-weight: 500;
      margin-top: 3px;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.85;
    }

    .seat.taken .seat-icon,
    .seat.mine .seat-icon {
      position: absolute;
      top: 4px; right: 5px;
      font-size: 9px;
      opacity: 0.7;
    }

    /* 사이드바 */
    .sidebar { display: flex; flex-direction: column; gap: 20px; }

    /* 통계 */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .stat-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
    }

    .stat-box .num {
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
    }

    .stat-box .label {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-box:nth-child(1) .num { color: #93c5fd; }
    .stat-box:nth-child(2) .num { color: #6ee7b7; }
    .stat-box:nth-child(3) .num { color: #c4b5fd; }

    /* 범례 */
    .legend { display: flex; flex-direction: column; gap: 8px; }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .legend-dot {
      width: 28px; height: 22px;
      border-radius: 6px;
      border: 1.5px solid;
      flex-shrink: 0;
    }

    .legend-dot.avail { background: var(--seat-avail); border-color: rgba(59,130,246,0.3); }
    .legend-dot.taken { background: var(--seat-taken); border-color: var(--seat-taken-border); }
    .legend-dot.mine  { background: var(--seat-mine);  border-color: var(--seat-mine-border); }

    /* 관리자 패널 */
    .admin-toggle {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s;
    }

    .admin-toggle:hover { border-color: var(--accent); color: var(--text); }

    .admin-toggle .arrow {
      transition: transform 0.3s;
    }

    .admin-toggle.open .arrow { transform: rotate(180deg); }

    #admin-panel {
      display: none;
      flex-direction: column;
      gap: 14px;
      margin-top: 14px;
    }

    #admin-panel.visible { display: flex; }

    .admin-pw-wrap {
      display: flex;
      gap: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input[type="datetime-local"],
    .form-group input[type="password"],
    .form-group input[type="text"] {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 10px 14px;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }

    .form-group input:focus { border-color: var(--accent); }

    .admin-actions { display: flex; gap: 8px; flex-direction: column; }

    .btn-sm { padding: 10px 14px; font-size: 13px; border-radius: 10px; }

    .btn-warning {
      background: rgba(245,158,11,0.15);
      color: #fbbf24;
      border: 1px solid rgba(245,158,11,0.3);
    }

    .btn-warning:hover { background: rgba(245,158,11,0.25); }

    /* 메시지 */
    .msg {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      display: none;
    }

    .msg.show { display: block; }
    .msg.success { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #34d399; }
    .msg.error   { background: rgba(239,68,68,0.12);  border: 1px solid rgba(239,68,68,0.3);  color: #f87171; }
    .msg.info    { background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.3); color: #93c5fd; }

    /* 신청 목록 */
    #reservation-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }

    #reservation-list::-webkit-scrollbar { width: 4px; }
    #reservation-list::-webkit-scrollbar-track { background: transparent; }
    #reservation-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .reservation-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .reservation-item .r-seat {
      font-weight: 800;
      color: var(--accent);
      font-size: 14px;
      min-width: 32px;
    }

    .reservation-item .r-name {
      flex: 1;
      padding: 0 10px;
      font-weight: 500;
    }

    .reservation-item .r-time {
      color: var(--text-muted);
      font-size: 11px;
    }

    /* 타이머 */
    #countdown-wrap {
      text-align: center;
      padding: 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: none;
    }

    #countdown-wrap.visible { display: block; }

    #countdown-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    #countdown-timer {
      font-size: 28px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* 애니메이션 */
    @keyframes seatPop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .seat.pop { animation: seatPop 0.35s ease; }

    /* 모달 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.show { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      animation: modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    .modal .modal-icon { font-size: 48px; margin-bottom: 16px; }
    .modal h2 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
    .modal p  { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; line-height: 1.6; }

    .modal-btns { display: flex; gap: 10px; justify-content: center; }

    /* 반응형 */
    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="badge">🪑 SEAT RESERVATION</div>
    <h1>서해고등학교 3학년<br>야간자기주도학습<br>좌석 선착순 신청</h1>
    <p>원하는 좌석을 선택하여 신청하세요</p>
  </header>

  <!-- 상태 배너 -->
  <div id="status-banner" class="closed">
    <span class="status-dot"></span>
    <span id="status-text">신청이 아직 열리지 않았습니다</span>
  </div>

  <!-- 카운트다운 -->
  <div id="countdown-wrap">
    <div id="countdown-label">남은 시간</div>
    <div id="countdown-timer">--:--:--</div>
  </div>

  <div style="height:20px"></div>

  <div class="layout">
    <!-- 좌석 영역 -->
    <div>
      <div class="card">
        <div class="card-title">좌석 배치도</div>

        <!-- 학번 + 이름 입력 -->
        <div class="name-input-wrap">
          <div class="name-input-row">
            <input type="text" id="user-studentid" placeholder="학번 (예: 10101)" maxlength="10" autocomplete="off"
              style="flex:1" onkeydown="if(event.key==='Enter') document.getElementById('user-name').focus()" />
            <input type="text" id="user-name" placeholder="이름" maxlength="10" autocomplete="off"
              style="flex:1" onkeydown="if(event.key==='Enter') setName()" />
            <button class="btn btn-primary" id="btn-set-name" onclick="setName()">확인</button>
          </div>

          <!-- 전자기기 사용 여부 -->
          <div style="background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;">
            <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:600;color:var(--text);">
              <input type="checkbox" id="device-check"
                style="width:17px;height:17px;accent-color:var(--warning);cursor:pointer;flex-shrink:0;" />
              💻 학습 목적 전자기기 사용
            </label>
            <p style="font-size:11.5px;color:#f87171;line-height:1.6;padding-left:27px;">
              * 학습 목적 이외에 전자 기기 사용을 금지하며, 적발 시 퇴출할 예정임.
            </p>
          </div>
        </div>

        <div id="msg-name" class="msg"></div>

        <div style="height:16px"></div>
        <div id="seat-grid"></div>
      </div>
    </div>

    <!-- 사이드바 -->
    <div class="sidebar">

      <!-- 통계 -->
      <div class="card">
        <div class="card-title">신청 현황</div>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="num" id="stat-total">46</div>
            <div class="label">전체</div>
          </div>
          <div class="stat-box">
            <div class="num" id="stat-taken">0</div>
            <div class="label">신청됨</div>
          </div>
          <div class="stat-box">
            <div class="num" id="stat-avail">46</div>
            <div class="label">남은석</div>
          </div>
        </div>
      </div>

      <!-- 범례 -->
      <div class="card">
        <div class="card-title">범례</div>
        <div class="legend">
          <div class="legend-item">
            <div class="legend-dot avail"></div>
            <span>신청 가능한 좌석</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot taken"></div>
            <span>신청된 좌석</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot mine"></div>
            <span>내가 신청한 좌석</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:var(--seat-device);border-color:var(--seat-device-border);"></div>
            <span>💻 전자기기 사용 좌석</span>
          </div>
        </div>
      </div>

      <!-- 신청 목록 -->
      <div class="card">
        <div class="card-title">신청 목록</div>
        <div id="reservation-list">
          <div style="text-align:center;color:var(--text-muted);font-size:13px;padding:20px 0;">
            아직 신청된 좌석이 없습니다
          </div>
        </div>
      </div>

      <!-- 관리자 -->
      <div class="card">
        <button class="admin-toggle" id="admin-toggle-btn" onclick="toggleAdmin()">
          <span>🔐 관리자 설정</span>
          <span class="arrow">▾</span>
        </button>

        <div id="admin-panel">
          <!-- 비밀번호 확인 -->
          <div id="admin-pw-section">
            <div class="form-group">
              <label>관리자 비밀번호</label>
              <div class="admin-pw-wrap">
                <input type="password" id="admin-pw-input" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') checkAdminPw()" />
                <button class="btn btn-primary btn-sm" onclick="checkAdminPw()">확인</button>
              </div>
            </div>
            <div id="msg-admin-pw" class="msg"></div>
          </div>

          <!-- 관리자 컨트롤 (인증 후 표시) -->
          <div id="admin-controls" style="display:none; flex-direction:column; gap:14px;">

            <div class="form-group">
              <label>신청 시작 시간</label>
              <input type="datetime-local" id="open-time" />
            </div>

            <div class="form-group">
              <label>신청 종료 시간</label>
              <input type="datetime-local" id="close-time" />
            </div>

            <div class="admin-actions">
              <button class="btn btn-success btn-sm" onclick="applySchedule()">⏱ 시간 설정 적용</button>
              <button class="btn btn-primary btn-sm" onclick="forceOpen()">🟢 지금 즉시 열기</button>
              <button class="btn btn-danger btn-sm" onclick="forceClose()">🔴 지금 즉시 닫기</button>
              <button class="btn btn-warning btn-sm" onclick="resetAll()">🗑 전체 초기화</button>
            </div>

            <div id="msg-admin" class="msg"></div>

            <div style="border-top:1px solid var(--border);padding-top:14px;">
              <div class="card-title" style="margin-bottom:12px;">좌석 취소 (관리자)</div>
              <div class="form-group">
                <label>취소할 좌석 번호</label>
                <div class="admin-pw-wrap">
                  <input type="text" id="cancel-seat-num" placeholder="예: 5" style="width:80px" />
                  <button class="btn btn-warning btn-sm" onclick="adminCancelSeat()">취소</button>
                </div>
              </div>
            </div>

            <button class="btn btn-sm" style="background:var(--surface2);color:var(--text-muted);border:1px solid var(--border);" onclick="exportCSV()">📥 신청 목록 내보내기 (CSV)</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- 확인 모달 -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal">
    <div class="modal-icon">🪑</div>
    <h2 id="modal-title">좌석 신청</h2>
    <p id="modal-body">정말 이 좌석을 신청하시겠습니까?</p>
    <div class="modal-btns">
      <button class="btn btn-primary" onclick="confirmSeat()">신청하기</button>
      <button class="btn" style="background:var(--surface2);color:var(--text-muted);border:1px solid var(--border);" onclick="closeModal()">취소</button>
    </div>
  </div>
</div>

<script>
  // ====================== 설정 ======================
  const TOTAL_SEATS = 46;
  const ADMIN_PW    = "admin1234";   // ← 관리자 비밀번호 (변경 가능)
  const STORAGE_KEY = "seatReservation_v1";
  const CONFIG_KEY  = "seatConfig_v1";

  // ====================== 상태 ======================
  let currentUser      = null;
  let currentStudentId = null;
  let mySeat           = null;
  let pendingSeat      = null;
  let seats            = {};   // { seatNum: { name, studentId, time } }
  let openTime      = null;
  let closeTime     = null;
  let forceStatus   = null;    // 'open' | 'closed' | null
  let adminAuthed   = false;
  let countdownInterval = null;

  // ====================== 초기화 ======================
  function init() {
    loadState();
    buildGrid();
    updateUI();
    startClockTick();
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        seats = d.seats || {};
      }
      const cfg = localStorage.getItem(CONFIG_KEY);
      if (cfg) {
        const c = JSON.parse(cfg);
        openTime    = c.openTime    || null;
        closeTime   = c.closeTime   || null;
        forceStatus = c.forceStatus || null;
      }
    } catch(e) {}
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ seats }));
    localStorage.setItem(CONFIG_KEY, JSON.stringify({ openTime, closeTime, forceStatus }));
  }

  // ====================== 좌석 그리드 ======================
  function buildGrid() {
    const grid = document.getElementById('seat-grid');
    grid.innerHTML = '';
    for (let i = 1; i <= TOTAL_SEATS; i++) {
      const el = document.createElement('div');
      el.className = 'seat';
      el.id = `seat-${i}`;
      el.innerHTML = `<div class="seat-num">${i}</div><div class="seat-name"></div><span class="seat-icon"></span>`;
      el.onclick = () => clickSeat(i);
      grid.appendChild(el);
    }
  }

  function updateGrid() {
    const taken = Object.keys(seats).length;
    document.getElementById('stat-taken').textContent = taken;
    document.getElementById('stat-avail').textContent = TOTAL_SEATS - taken;

    for (let i = 1; i <= TOTAL_SEATS; i++) {
      const el = document.getElementById(`seat-${i}`);
      const s  = seats[i];
      const nameEl = el.querySelector('.seat-name');
      const iconEl = el.querySelector('.seat-icon');

      el.classList.remove('taken', 'mine', 'device', 'device-mine', 'disabled');
      nameEl.textContent = '';
      iconEl.textContent = '';
      // 전자기기 아이콘 제거
      const prevDevIcon = el.querySelector('.seat-device-icon');
      if (prevDevIcon) prevDevIcon.remove();

      if (s) {
        const devIcon = document.createElement('span');
        devIcon.className = 'seat-device-icon';
        if (mySeat === i) {
          el.classList.add(s.useDevice ? 'device-mine' : 'mine');
          nameEl.textContent = s.name;
          iconEl.textContent = '⭐';
          if (s.useDevice) { devIcon.textContent = '💻'; el.appendChild(devIcon); }
        } else {
          el.classList.add(s.useDevice ? 'device' : 'taken');
          nameEl.textContent = s.name;
          iconEl.textContent = '✓';
          if (s.useDevice) { devIcon.textContent = '💻'; el.appendChild(devIcon); }
        }
      } else {
        if (!isOpen() || mySeat !== null) {
          el.classList.add('disabled');
        }
      }
    }

    // 신청 목록 업데이트
    updateReservationList();
  }

  function updateReservationList() {
    const list = document.getElementById('reservation-list');
    const keys = Object.keys(seats).map(Number).sort((a,b) => a-b);
    if (keys.length === 0) {
      list.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:20px 0;">아직 신청된 좌석이 없습니다</div>';
      return;
    }
    list.innerHTML = keys.map(k => {
      const s = seats[k];
      const sid = s.studentId ? `<span style="color:var(--text-muted);font-size:11px;">${escHtml(s.studentId)}</span> ` : '';
      const dev = s.useDevice ? `<span style="font-size:10px;margin-left:4px;" title="전자기기 사용">💻</span>` : '';
      return `<div class="reservation-item">
        <span class="r-seat">${k}번</span>
        <span class="r-name">${sid}${escHtml(s.name)}${dev}</span>
        <span class="r-time">${s.time}</span>
      </div>`;
    }).join('');
  }

  // ====================== 시간 & 상태 ======================
  function isOpen() {
    if (forceStatus === 'open')   return true;
    if (forceStatus === 'closed') return false;
    const now = Date.now();
    if (openTime && closeTime) {
      return now >= new Date(openTime).getTime() && now < new Date(closeTime).getTime();
    }
    if (openTime && !closeTime) {
      return now >= new Date(openTime).getTime();
    }
    return false;
  }

  function getStatusInfo() {
    const now = Date.now();
    if (forceStatus === 'open')   return { state: 'open',   text: '🟢 신청이 열려 있습니다!' };
    if (forceStatus === 'closed') return { state: 'closed', text: '🔴 관리자가 신청을 마감했습니다' };
    if (!openTime) return { state: 'closed', text: '⏳ 아직 신청 일정이 설정되지 않았습니다' };
    const open  = new Date(openTime).getTime();
    const close = closeTime ? new Date(closeTime).getTime() : null;
    if (now < open) {
      const diff = open - now;
      return { state: 'waiting', text: `⏰ 신청 시작까지 ${formatDiff(diff)}`, countdown: diff, countdownTarget: open, countdownLabel: '신청 시작까지' };
    }
    if (!close || now < close) {
      if (close) {
        const diff = close - now;
        return { state: 'open', text: `🟢 신청 진행 중  ·  종료까지 ${formatDiff(diff)}`, countdown: diff, countdownTarget: close, countdownLabel: '신청 종료까지' };
      }
      return { state: 'open', text: '🟢 신청이 열려 있습니다!' };
    }
    return { state: 'closed', text: '🔴 신청이 마감되었습니다' };
  }

  function formatDiff(ms) {
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return `${h}시간 ${m}분 ${sec}초`;
    if (m > 0) return `${m}분 ${sec}초`;
    return `${sec}초`;
  }

  function formatTime(ms) {
    const s = Math.floor(ms / 1000);
    const h = String(Math.floor(s / 3600)).padStart(2,'0');
    const m = String(Math.floor((s % 3600) / 60)).padStart(2,'0');
    const sc = String(s % 60).padStart(2,'0');
    return `${h}:${m}:${sc}`;
  }

  function startClockTick() {
    setInterval(() => updateUI(), 1000);
  }

  function updateUI() {
    const info = getStatusInfo();
    const banner = document.getElementById('status-banner');
    banner.className = info.state;
    document.getElementById('status-text').textContent = info.text;

    const cdWrap = document.getElementById('countdown-wrap');
    if (info.countdown && info.countdown > 0) {
      cdWrap.classList.add('visible');
      document.getElementById('countdown-label').textContent = info.countdownLabel || '남은 시간';
      document.getElementById('countdown-timer').textContent = formatTime(info.countdown);
    } else {
      cdWrap.classList.remove('visible');
    }

    updateGrid();
  }

  let currentUseDevice = false;

  // ====================== 이름/학번 설정 ======================
  function setName() {
    const sid = document.getElementById('user-studentid').value.trim();
    const val = document.getElementById('user-name').value.trim();
    if (!sid) { showMsg('msg-name', '학번을 입력해주세요.', 'error'); document.getElementById('user-studentid').focus(); return; }
    if (!val) { showMsg('msg-name', '이름을 입력해주세요.', 'error'); document.getElementById('user-name').focus(); return; }
    currentUser = val;
    currentStudentId = sid;
    currentUseDevice = document.getElementById('device-check').checked;
    document.getElementById('user-studentid').disabled = true;
    document.getElementById('user-name').disabled = true;
    document.getElementById('device-check').disabled = true;
    document.getElementById('btn-set-name').disabled = true;
    const deviceMsg = currentUseDevice ? ' · 💻 전자기기 사용' : '';
    showMsg('msg-name', `안녕하세요, ${sid} ${val}님!${deviceMsg} 원하는 좌석을 클릭하세요.`, 'success');
    updateGrid();
  }

  // ====================== 좌석 클릭 ======================
  function clickSeat(num) {
    if (!isOpen()) { showMsg('msg-name', '현재 신청 기간이 아닙니다.', 'error'); return; }
    if (!currentUser) { showMsg('msg-name', '먼저 학번과 이름을 입력해주세요!', 'error'); return; }
    if (mySeat !== null) { showMsg('msg-name', `이미 ${mySeat}번 좌석을 신청하셨습니다.`, 'info'); return; }
    if (seats[num]) { showMsg('msg-name', `${num}번 좌석은 이미 ${seats[num].name}님이 신청하셨습니다.`, 'error'); return; }
    pendingSeat = num;
    document.getElementById('device-check').checked = false;
    document.getElementById('modal-title').textContent = `${num}번 좌석 신청`;
    document.getElementById('modal-body').textContent = `${currentStudentId} ${currentUser}님,\n${num}번 좌석을 신청하시겠습니까?\n한 번 신청하면 취소할 수 없습니다.`;
    document.getElementById('confirm-modal').classList.add('show');
  }

  function confirmSeat() {
    const num = pendingSeat;  // closeModal() 호출 전에 먼저 저장
    closeModal();
    if (!num) return;
    pendingSeat = null;

    // 다시 한번 확인
    if (!isOpen()) { showMsg('msg-name', '신청 시간이 지났습니다.', 'error'); return; }
    if (seats[num]) { showMsg('msg-name', '방금 다른 사람이 선택했습니다. 다른 좌석을 선택해 주세요.', 'error'); updateGrid(); return; }

    const now = new Date();
    const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    const useDevice = currentUseDevice;
    seats[num] = { name: currentUser, studentId: currentStudentId, time: timeStr, useDevice };
    mySeat = num;
    saveState();

    // 팝 애니메이션
    const el = document.getElementById(`seat-${num}`);
    el.classList.add('pop');
    setTimeout(() => el.classList.remove('pop'), 400);

    showMsg('msg-name', `🎉 ${currentStudentId} ${currentUser}님, ${num}번 좌석이 신청되었습니다!`, 'success');
    updateGrid();
  }

  function closeModal() {
    document.getElementById('confirm-modal').classList.remove('show');
    // pendingSeat는 confirmSeat()에서 관리
  }

  // ====================== 관리자 ======================
  function toggleAdmin() {
    const btn   = document.getElementById('admin-toggle-btn');
    const panel = document.getElementById('admin-panel');
    btn.classList.toggle('open');
    panel.classList.toggle('visible');
  }

  function checkAdminPw() {
    const pw = document.getElementById('admin-pw-input').value;
    if (pw === ADMIN_PW) {
      adminAuthed = true;
      document.getElementById('admin-pw-section').style.display = 'none';
      document.getElementById('admin-controls').style.display = 'flex';

      // 현재 시간 설정 값 채우기
      if (openTime) document.getElementById('open-time').value = toLocalDateTimeInput(new Date(openTime));
      if (closeTime) document.getElementById('close-time').value = toLocalDateTimeInput(new Date(closeTime));
    } else {
      showMsg('msg-admin-pw', '비밀번호가 틀렸습니다.', 'error');
    }
  }

  function applySchedule() {
    const ot = document.getElementById('open-time').value;
    const ct = document.getElementById('close-time').value;
    if (!ot) { showMsg('msg-admin', '시작 시간을 설정해주세요.', 'error'); return; }
    if (ct && new Date(ct) <= new Date(ot)) { showMsg('msg-admin', '종료 시간은 시작 시간보다 늦어야 합니다.', 'error'); return; }
    openTime    = ot ? new Date(ot).toISOString() : null;
    closeTime   = ct ? new Date(ct).toISOString() : null;
    forceStatus = null;
    saveState();
    showMsg('msg-admin', '시간이 설정되었습니다.', 'success');
    updateUI();
  }

  function forceOpen() {
    forceStatus = 'open';
    saveState();
    showMsg('msg-admin', '신청이 즉시 열렸습니다.', 'success');
    updateUI();
  }

  function forceClose() {
    forceStatus = 'closed';
    saveState();
    showMsg('msg-admin', '신청이 즉시 마감되었습니다.', 'success');
    updateUI();
  }

  function resetAll() {
    if (!confirm('정말 모든 좌석 신청을 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) return;
    seats = {};
    mySeat = null;
    currentUser = null;
    currentStudentId = null;
    currentUseDevice = false;
    document.getElementById('user-studentid').disabled = false;
    document.getElementById('user-name').disabled = false;
    document.getElementById('device-check').disabled = false;
    document.getElementById('btn-set-name').disabled = false;
    document.getElementById('user-studentid').value = '';
    document.getElementById('user-name').value = '';
    document.getElementById('device-check').checked = false;
    saveState();
    showMsg('msg-admin', '모든 신청이 초기화되었습니다.', 'success');
    updateGrid();
    hideMsg('msg-name');
  }

  function adminCancelSeat() {
    const num = parseInt(document.getElementById('cancel-seat-num').value);
    if (isNaN(num) || num < 1 || num > TOTAL_SEATS) {
      showMsg('msg-admin', `1~${TOTAL_SEATS} 사이의 번호를 입력하세요.`, 'error'); return;
    }
    if (!seats[num]) { showMsg('msg-admin', `${num}번 좌석은 신청되지 않았습니다.`, 'error'); return; }
    delete seats[num];
    if (mySeat === num) mySeat = null;
    document.getElementById('cancel-seat-num').value = '';
    saveState();
    showMsg('msg-admin', `${num}번 좌석 신청이 취소되었습니다.`, 'success');
    updateGrid();
  }

  function exportCSV() {
    const keys = Object.keys(seats).map(Number).sort((a,b) => a-b);
    const rows = [['좌석번호', '학번', '이름', '전자기기사용', '신청시간'], ...keys.map(k => [k, seats[k].studentId || '', seats[k].name, seats[k].useDevice ? 'O' : 'X', seats[k].time])];
    const csv = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = '좌석신청목록.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  // ====================== 유틸 ======================
  function toLocalDateTimeInput(d) {
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = `msg ${type} show`;
    clearTimeout(el._timeout);
    el._timeout = setTimeout(() => hideMsg(id), 5000);
  }

  function hideMsg(id) {
    const el = document.getElementById(id);
    if (el) el.className = 'msg';
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ====================== 시작 ======================
  init();
</script>
</body>
</html>
